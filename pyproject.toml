[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "complaints"
version = "0.1.0"
description = "LLM enrichment inside a governed data pipeline: PII redaction before any model call, cached and versioned enrichment, cost ledger, evaluation against labels, and BI-ready marts, on real CFPB consumer complaints."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1", "pandas>=2.0", "pyarrow>=15", "scikit-learn>=1.4", "pydantic>=2.6"]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "anthropic>=0.70"]

[project.scripts]
complaints = "complaints.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/complaints"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
