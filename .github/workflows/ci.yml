name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  pipeline:
    # Runs the real pipeline on the pinned sample with the baseline engine, so every
    # change is checked end to end: harmonisation, redaction, enrichment cache,
    # evaluation and marts. (The Claude engine needs an API key and runs on demand.)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: complaints build
      - run: complaints enrich --engine tfidf
      - name: Second run must hit the cache only
        shell: bash
        run: |
          complaints enrich --engine tfidf | tee second.json
          grep -q '"new": 0' second.json
      - run: complaints gold --engine tfidf
      - name: Summary
        run: |
          { echo "## Evaluation (test split)"; echo '```'; complaints evaluate; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
